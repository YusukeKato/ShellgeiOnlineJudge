[tool.poetry]
name = "ShellgeiOnlineJudge"
version = "3.0.0"
description = "Shellgei Online Judge"
authors = ["YusukeKato"]
license = "Apache 2.0"
readme = "README.md"

[[tool.poetry.packages]]
include = "backend"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "^0.136.3"
uvicorn = "^0.35.0"
pydantic = "^2.11.7"
pyyaml = "^6.0.3"

[tool.poetry.group.backend.dependencies]
# 画像判定はbackend専用packageへ閉じ込め、runnerへ画像decode依存を持ち込まない。
pillow = "^12.3.0"
sqlalchemy = "^2.0.47"
psycopg2-binary = "^2.9.11"

[tool.poetry.group.runner.dependencies]
docker = "^7.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
ruff = "^0.12.12"
mypy = ">=1.17.1,<3.0.0"
types-requests = "^2.32.4.20250809"
types-docker = "^7.1.0.20250822"
types-pyyaml = "^6.0.12"

# ブラウザE2Eとそのscriptの型検査専用。本番imageには導入しない。
[tool.poetry.group.e2e]
optional = true

[tool.poetry.group.e2e.dependencies]
playwright = "1.62.0"

[tool.mypy]
mypy_path = "backend"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
    "docker: requires an explicitly enabled Docker integration-test environment",
    "full_regression: runs every problem answer in real sandbox containers",
    "compose_e2e: starts an isolated full rootless Compose stack",
]
