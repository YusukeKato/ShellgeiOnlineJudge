[tool.poetry]
name = "ShellgeiOnlineJudge"
version = "2.2.0"
description = "Shellgei Online Judge"
authors = ["YusukeKato"]
license = "Apache 2.0"
readme = "README.md"

[[tool.poetry.packages]]
include = "backend"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "^0.116.1"
uvicorn = "^0.35.0"
gunicorn = "^23.0.0"
docker = "^7.1.0"
pytz = "^2025.2"
pydantic = "^2.11.7"
pytest = "^8.4.2"
ruff = "^0.12.12"
mypy = "^1.17.1"
types-requests = "^2.32.4.20250809"
types-docker = "^7.1.0.20250822"
types-pytz = "^2025.2.0.20250809"
sqlalchemy = "^2.0.47"
psycopg2-binary = "^2.9.11"
pyyaml = "^6.0.3"
types-pyyaml = "^6.0.12"
pillow = "^12.3.0"

[tool.mypy]
mypy_path = "backend"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
    "docker: requires an explicitly enabled Docker integration-test environment",
    "full_regression: runs every problem answer in real sandbox containers",
]
