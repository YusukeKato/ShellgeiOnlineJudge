[tool.poetry]
name = "ShellgeiOnlineJudge"
version = "3.0.0"
description = "Shellgei Online Judge"
authors = ["YusukeKato"]
license = "Apache 2.0"
readme = "README.md"

[[tool.poetry.packages]]
include = "backend"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "^0.141.1"
uvicorn = "^0.53.0"
pydantic = "^2.13.5"
pyyaml = "^6.0.3"

[tool.poetry.group.backend.dependencies]
# 画像判定はbackend専用packageへ閉じ込め、runnerへ画像decode依存を持ち込まない。
pillow = "^12.3.0"
sqlalchemy = "^2.0.54"
psycopg2-binary = "^2.9.13"

[tool.poetry.group.runner.dependencies]
docker = "^7.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.16.8"
mypy = "^2.3.1"
types-requests = "^2.33.0.20260906"
types-docker = "^7.2.0.20260827"
types-pyyaml = "^6.0.12.20260906"

# ブラウザE2Eとそのscriptの型検査専用。本番imageには導入しない。
[tool.poetry.group.e2e]
optional = true

[tool.poetry.group.e2e.dependencies]
playwright = "1.63.0"

# Ruff 0.16以降も従来の既定ruleを維持し、依存更新とlint方針の変更を分離する。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
mypy_path = "backend"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
    "docker: requires an explicitly enabled Docker integration-test environment",
    "full_regression: runs every problem answer in real sandbox containers",
    "compose_e2e: starts an isolated full rootless Compose stack",
]
