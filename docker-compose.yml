x-service-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    container_name: soj-db
    restart: always
    environment:
      - TZ=Asia/Tokyo
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data  # DBデータの永続化用ボリュームを設定
    ports:
      - "127.0.0.1:5432:5432"
    logging: *service-logging
    networks:
      - backend_db

  runner:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: soj-runner
    restart: always
    command: ["uvicorn", "runner_main:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    volumes:
      # Docker socketは外部HTTPを処理しないrunnerだけにマウントする。
      - ${DOCKER_SOCKET_PATH:?Set DOCKER_SOCKET_PATH to the rootless Docker socket}:/run/docker.sock
    environment:
      - TZ=Asia/Tokyo
      - DOCKER_HOST=unix:///run/docker.sock
      - SANDBOX_OWNER_ID=${SANDBOX_OWNER_ID:-shellgei-online-judge}
      - RUNNER_SHARED_SECRET=${RUNNER_SHARED_SECRET:?Set RUNNER_SHARED_SECRET to a random value}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/health').read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging: *service-logging
    networks:
      - backend_runner

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: soj-backend
    restart: always
    environment:
      - TZ=Asia/Tokyo
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL}
      - DATABASE_OPERATION_TIMEOUT_SECONDS=${DATABASE_OPERATION_TIMEOUT_SECONDS:-5}
      - SERVER_URL=${SERVER_URL:-https://shellgei-online-judge.com}
      - EXECUTION_LOG_RETENTION_DAYS=${EXECUTION_LOG_RETENTION_DAYS:-365}
      - EXECUTION_LOG_MAX_ROWS=${EXECUTION_LOG_MAX_ROWS:-10000}
      - RUNNER_SHARED_SECRET=${RUNNER_SHARED_SECRET:?Set RUNNER_SHARED_SECRET to a random value}
    depends_on:
      db:
        condition: service_started
      runner:
        condition: service_healthy
    logging: *service-logging
    networks:
      - frontend_backend
      - backend_db
      - backend_runner

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_SOJ_URL: ${REACT_APP_SOJ_URL:-https://shellgei-online-judge.com}
        REACT_APP_UPDATE_DATE: ${REACT_APP_UPDATE_DATE:-}
        REACT_APP_VERSION: ${REACT_APP_VERSION:-}
        REACT_APP_X_URL: ${REACT_APP_X_URL:-}
        REACT_APP_GITHUB_REPO_URL: ${REACT_APP_GITHUB_REPO_URL:-}
        REACT_APP_GITHUB_AUTHOR_URL: ${REACT_APP_GITHUB_AUTHOR_URL:-}
        REACT_APP_BLOG_URL: ${REACT_APP_BLOG_URL:-}
        REACT_APP_MIXI2_URL: ${REACT_APP_MIXI2_URL:-}
    container_name: soj-frontend
    restart: always
    ports:
      # rootless Dockerで利用できる非特権ポートを既定値にする。
      - "${HTTPS_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # rootless daemonユーザーが読める証明書ファイルを指定する。
      - ${TLS_CERTIFICATE_PATH:-./deploy/tls/fullchain.pem}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:-./deploy/tls/privkey.pem}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      - backend
    logging: *service-logging
    networks:
      - frontend_backend

volumes:
  db_data: # DB永続化用ボリューム

networks:
  frontend_backend:
  backend_db:
    internal: true
  backend_runner:
    internal: true
