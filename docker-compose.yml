services:
  db:
    image: postgres:15-alpine
    container_name: soj-db
    restart: always
    env_file:
      - ${ENV_FILE_PATH:-.env}
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - db_data:/var/lib/postgresql/data  # DBデータの永続化用ボリュームを設定
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: soj-backend
    restart: always
    env_file:
      - ${ENV_FILE_PATH:-.env}
    volumes:
      # rootless Docker socketのみをマウントする。未設定ならfail closed。
      - ${DOCKER_SOCKET_PATH:?Set DOCKER_SOCKET_PATH to the rootless Docker socket}:/run/docker.sock
    environment:
      - TZ=Asia/Tokyo
      - DOCKER_HOST=unix:///run/docker.sock
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_SOJ_URL: ${REACT_APP_SOJ_URL:-https://shellgei-online-judge.com}
        REACT_APP_UPDATE_DATE: ${REACT_APP_UPDATE_DATE:-}
        REACT_APP_VERSION: ${REACT_APP_VERSION:-}
        REACT_APP_X_URL: ${REACT_APP_X_URL:-}
        REACT_APP_GITHUB_REPO_URL: ${REACT_APP_GITHUB_REPO_URL:-}
        REACT_APP_GITHUB_AUTHOR_URL: ${REACT_APP_GITHUB_AUTHOR_URL:-}
        REACT_APP_BLOG_URL: ${REACT_APP_BLOG_URL:-}
        REACT_APP_MIXI2_URL: ${REACT_APP_MIXI2_URL:-}
    container_name: soj-frontend
    restart: always
    ports:
      # rootless Dockerで利用できる非特権ポートを既定値にする。
      - "${HTTPS_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # rootless daemonユーザーが読める証明書ファイルを指定する。
      - ${TLS_CERTIFICATE_PATH:-./deploy/tls/fullchain.pem}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:-./deploy/tls/privkey.pem}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      - backend

volumes:
  db_data: # DB永続化用ボリューム
