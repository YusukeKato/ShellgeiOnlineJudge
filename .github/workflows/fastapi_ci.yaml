name: FastAPI CI

on:
  push:
  pull_request:
  schedule:
    - cron: "45 10 * * 2" # At 10:45 AM (UTC) every Tuesday.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting_and_testing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install poetry==2.4.1
          poetry check --lock
          poetry install --no-interaction

      - name: Run linting (ruff check)
        run: poetry run ruff check .

      - name: Run formatting check (ruff format)
        run: poetry run ruff format --check .

      - name: Run static type checking (mypy)
        run: poetry run mypy .

      - name: Run backend unit tests
        run: poetry run pytest -m "not docker"
