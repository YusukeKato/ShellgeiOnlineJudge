name: Supply Chain CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 11 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Workflow, secrets and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true
      - name: Install locked development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          python ci/bootstrap_pip.py
          python -m pip install poetry==2.5.1 certifi==2026.10.19
          poetry check --lock
          poetry install --no-interaction
      - name: Install verified scanners
        run: |
          python ci/install_tools.py "$RUNNER_TEMP/soj-tools" actionlint gitleaks syft grype
          printf 'GRYPE_DB_CACHE_DIR=%s/grype-db\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Validate workflows and policy
        run: |
          "$RUNNER_TEMP/soj-tools/actionlint"
          poetry run pytest backend/tests/test_ci_policy.py backend/tests/test_supply_chain.py backend/tests/test_deployment.py backend/tests/test_rootless_ci.py
      - name: Scan complete Git history and current files
        run: |
          "$RUNNER_TEMP/soj-tools/gitleaks" git . --redact=100 --no-banner --log-opts=--all
          "$RUNNER_TEMP/soj-tools/gitleaks" dir . --redact=100 --no-banner
      - name: Update vulnerability database
        run: |
          "$RUNNER_TEMP/soj-tools/grype" db update
      - name: Verify scanner failure detection
        run: poetry run python ci/supply_chain.py fixtures --tools "$RUNNER_TEMP/soj-tools" --reports "$RUNNER_TEMP/scanner-fixtures"
      - name: Scan lock files and generate SBOMs
        id: scan
        run: poetry run python ci/supply_chain.py source --tools "$RUNNER_TEMP/soj-tools" --reports "$RUNNER_TEMP/dependency-reports"
      - name: Retain dependency reports even when vulnerabilities block the job
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-reports
          path: ${{ runner.temp }}/dependency-reports/
          retention-days: 14
          if-no-files-found: error

  changes:
    name: Select runtime verification scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # main pushでは本番更新を確認できたcommitを、deploy runの記録から読み取る。
    permissions:
      contents: read
      actions: read
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      browser_selection: ${{ steps.review.outputs.browser_selection }}
      browser_shards: ${{ steps.review.outputs.browser_shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare with PR base or deployed commit
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/deploy.py scope
      - name: Select problem screen review scope
        id: review
        run: python3 backend/soj_tools/problem_review.py --github-output

  runtime:
    name: Rootless runtime build and image scan
    needs: changes
    # imageへ入らない文書だけの変更では、build・scan・E2Eと配備archiveの作成を省略する。
    if: ${{ needs.changes.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: backend
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true
      - name: Install locked development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          python ci/bootstrap_pip.py
          python -m pip install poetry==2.5.1 certifi==2026.10.19
          poetry check --lock
          poetry install --no-interaction
      - name: Prepare user systemd and D-Bus for rootless cgroups
        run: bash ci/prepare_rootless.sh
      - name: Set up isolated rootless Docker
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
          rootless: true
          set-host: true
      - name: Install verified inventory and vulnerability tools
        run: |
          python ci/install_tools.py "$RUNNER_TEMP/soj-tools" syft grype
          printf 'GRYPE_DB_CACHE_DIR=%s/grype-db\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Validate rootless daemon, build current targets and update vulnerability database
        env:
          VITE_X_URL: ${{ vars.VITE_X_URL || 'https://x.com/yusukekato_main' }}
          VITE_GITHUB_REPO_URL: ${{ vars.VITE_GITHUB_REPO_URL || 'https://github.com/YusukeKato/ShellgeiOnlineJudge' }}
          VITE_GITHUB_AUTHOR_URL: ${{ vars.VITE_GITHUB_AUTHOR_URL || 'https://github.com/YusukeKato' }}
          VITE_BLOG_URL: ${{ vars.VITE_BLOG_URL || 'https://yusukekato.jp' }}
          VITE_MIXI2_URL: ${{ vars.VITE_MIXI2_URL || 'https://mixi.social/communities/dcf8e9d8-a6c4-40a9-8e05-328b4424f886/about' }}
        run: |
          # 脆弱性DBの取得はimage buildに依存しないため並行し、scan前に成否を確定する。
          "$RUNNER_TEMP/soj-tools/grype" db update > "$RUNNER_TEMP/grype-db-update.log" 2>&1 &
          grype_update=$!
          poetry run python -c 'from ci.supply_chain import rootless; rootless()'
          docker build --file deploy/sandbox/Dockerfile --tag soj-sandbox:ci .
          printf 'SANDBOX_IMAGE_ID=%s\n' "$(docker image inspect soj-sandbox:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
          docker build --file backend/Dockerfile --target backend --tag soj-backend:ci .
          # 長いbuild・scanの前に、実際に資源制限付きcontainerを起動できるか検証する。
          poetry run python -c 'import subprocess; from ci.supply_chain import inspect_python_runtime; image = subprocess.check_output(["docker", "image", "inspect", "soj-backend:ci", "--format", "{{.Id}}"], text=True).strip(); print(inspect_python_runtime(image))'
          docker build --file backend/Dockerfile --target runner --tag soj-runner:ci .
          # 検証・配備するfrontend imageに、日本時間のbuild日を埋め込む。
          VITE_UPDATE_DATE="$(TZ=Asia/Tokyo date +%F)"
          export VITE_UPDATE_DATE
          docker build --file frontend/Dockerfile --build-arg VITE_SOJ_URL= \
            --build-arg VITE_UPDATE_DATE --build-arg VITE_X_URL --build-arg VITE_GITHUB_REPO_URL \
            --build-arg VITE_GITHUB_AUTHOR_URL --build-arg VITE_BLOG_URL --build-arg VITE_MIXI2_URL \
            --tag soj-frontend:ci .
          docker build --file deploy/postgres/Dockerfile --tag soj-db:ci .
          grype_status=0
          wait "$grype_update" || grype_status=$?
          cat "$RUNNER_TEMP/grype-db-update.log"
          # DB更新の失敗時に古いDBや未取得DBでscanへ進まない。
          test "$grype_status" -eq 0
      - name: Reject compromised CA chains in runtime stores
        run: |
          docker build --file backend/Dockerfile --target build-tools --tag soj-python-build:ci .
          docker build --file deploy/sandbox/Dockerfile --target textimg-build --tag soj-go-build:ci .
          docker build --file deploy/sandbox/Dockerfile --target problem-data --tag soj-data-build:ci .
          docker build --file frontend/Dockerfile --target builder --tag soj-node-build:ci .
          poetry run python ci/check_ca_trust.py soj-backend:ci soj-runner:ci soj-frontend:ci soj-db:ci soj-python-build:ci soj-go-build:ci soj-data-build:ci soj-node-build:ci
      - name: Scan runtime images and prepare candidate archive
        id: scan
        run: poetry run python ci/supply_chain.py runtime --tools "$RUNNER_TEMP/soj-tools" --reports "$RUNNER_TEMP/runtime-reports" --sandbox "$SANDBOX_IMAGE_ID"
      # 後続のE2E jobと配備が同じarchiveを使う。検出で停止した場合もreview用に残す。
      - name: Retain runtime inventory and candidate for review
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-reports
          path: ${{ runner.temp }}/runtime-reports/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

  regression:
    name: Rootless Compose regression and image boundary checks
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true
      - name: Install locked development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          python ci/bootstrap_pip.py
          python -m pip install poetry==2.5.1 certifi==2026.10.19
          poetry check --lock
          poetry install --no-interaction
      - name: Prepare user systemd and D-Bus for rootless cgroups
        run: bash ci/prepare_rootless.sh
      - name: Set up isolated rootless Docker
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
          rootless: true
          set-host: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-reports
          path: ${{ runner.temp }}/runtime-reports
      # 再buildせず、同じrunでscan・署名対象にしたimageをIDで照合して読み込む。
      - name: Load scanned runtime images
        run: |
          poetry run python -c 'import os; from pathlib import Path; from ci.supply_chain import load_candidate; load_candidate(Path(os.environ["RUNNER_TEMP"]) / "runtime-reports")'
          printf 'SANDBOX_IMAGE_ID=%s\n' "$(docker image inspect soj-sandbox:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Pull verified infrastructure images
        run: |
          poetry run python -c 'import subprocess; from tests.postgres_support import upstream_postgres_image; refs = [upstream_postgres_image()]; [subprocess.run(["docker", "pull", ref], check=True) for ref in refs]'
      # browser検査は並列のbrowser jobで行い、ここでは他の全検査を行う。
      - name: Full Compose regression and image boundary checks
        id: regression
        env:
          SOJ_RUN_DOCKER_TESTS: "1"
          SOJ_RUN_COMPOSE_E2E: "1"
          SOJ_DB_IMAGE: soj-db:ci
          SOJ_COMPOSE_BACKEND_IMAGE: soj-backend:ci
          SOJ_COMPOSE_RUNNER_IMAGE: soj-runner:ci
          SOJ_COMPOSE_FRONTEND_IMAGE: soj-frontend:ci
          SOJ_RUN_FULL_REGRESSION: "1"
          SOJ_RUN_RUNTIME_IMAGE_TESTS: "1"
          SOJ_BACKEND_RUNTIME_IMAGE: soj-backend:ci
          SOJ_RUNNER_RUNTIME_IMAGE: soj-runner:ci
        run: |
          shopt -s nullglob
          poetry run pytest --basetemp "$RUNNER_TEMP/soj-compose-tests" --deselect backend/tests/integration/test_compose_e2e.py::test_browser_submissions_and_display backend/tests/integration/test_compose_e2e.py backend/tests/integration/test_production_deploy.py backend/tests/integration/test_runtime_images.py backend/tests/integration/test_postgres_image.py backend/tests/integration/test_sandbox_tools.py backend/tests/integration/test_base64_solutions.py backend/tests/integration/test_unique_visitors_solutions.py backend/tests/integration/test_sales_leaders_solutions.py backend/tests/integration/test_sha256_solutions.py backend/tests/integration/test_service_changes_solutions.py backend/tests/integration/test_paste_solutions.py backend/tests/integration/test_fold_solutions.py backend/tests/integration/test_pending_tasks_solutions.py backend/tests/integration/test_problem_*_solutions.py

  browser:
    name: Rootless browser review (${{ matrix.shard }})
    needs: [changes, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 全問題の画面検査だけを複数jobへ分ける。shardの一覧はchanges jobが選ぶ。
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.browser_shards) }}
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true
      - name: Install locked development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          python ci/bootstrap_pip.py
          python -m pip install poetry==2.5.1 certifi==2026.10.19
          poetry check --lock
          poetry install --no-interaction
      - name: Prepare user systemd and D-Bus for rootless cgroups
        run: bash ci/prepare_rootless.sh
      - name: Set up isolated rootless Docker
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
          rootless: true
          set-host: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-reports
          path: ${{ runner.temp }}/runtime-reports
      # 再buildせず、同じrunでscan・署名対象にしたimageをIDで照合して読み込む。
      - name: Load scanned runtime images
        run: |
          poetry run python -c 'import os; from pathlib import Path; from ci.supply_chain import load_candidate; load_candidate(Path(os.environ["RUNNER_TEMP"]) / "runtime-reports")'
          printf 'SANDBOX_IMAGE_ID=%s\n' "$(docker image inspect soj-sandbox:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Pull verified infrastructure images
        run: |
          poetry run python -c 'import subprocess; from tests.postgres_support import upstream_postgres_image; refs = [upstream_postgres_image()]; [subprocess.run(["docker", "pull", ref], check=True) for ref in refs]'
      - name: Build browser test image
        run: |
          docker build --file backend/tests/integration/browser/Dockerfile --tag soj-browser:ci .
          poetry run python ci/check_ca_trust.py soj-browser:ci
      - name: Browser submissions and problem screen review
        id: browser
        env:
          SOJ_RUN_DOCKER_TESTS: "1"
          SOJ_RUN_COMPOSE_E2E: "1"
          SOJ_DB_IMAGE: soj-db:ci
          SOJ_COMPOSE_BACKEND_IMAGE: soj-backend:ci
          SOJ_COMPOSE_RUNNER_IMAGE: soj-runner:ci
          SOJ_COMPOSE_FRONTEND_IMAGE: soj-frontend:ci
          SOJ_COMPOSE_BROWSER_IMAGE: soj-browser:ci
          SOJ_BROWSER_PROBLEM_IDS: ${{ needs.changes.outputs.browser_selection }}
          SOJ_BROWSER_SHARD: ${{ matrix.shard }}
        run: poetry run pytest --basetemp "$RUNNER_TEMP/soj-compose-tests" backend/tests/integration/test_compose_e2e.py::test_browser_submissions_and_display
      - name: Retain browser review screenshots
        if: ${{ always() && steps.browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-ui-review-${{ strategy.job-index }}
          path: ${{ runner.temp }}/soj-compose-tests/**/soj-ui/*.png
          retention-days: 14
          if-no-files-found: error

  # branch保護のrequired checkに使う安定したjob名。shard数で名前が変わるbrowser jobも含め、
  # 全runtime検査の成功、または文書だけの変更で全検査が省略されたことを1つの結果にまとめる。
  runtime-result:
    name: Rootless runtime E2E and image scan
    needs: [changes, runtime, regression, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all runtime checks or a documentation-only skip
        env:
          SCOPE: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.runtime }}
          RESULTS: ${{ needs.runtime.result }} ${{ needs.regression.result }} ${{ needs.browser.result }}
        run: |
          echo "scope=$SCOPE runtime=$REQUIRED results=$RESULTS"
          test "$SCOPE" = success
          if [ "$REQUIRED" = false ]; then
            test "$RESULTS" = "skipped skipped skipped"
          else
            test "$RESULTS" = "success success success"
          fi

  provenance:
    name: Attest reviewed main artifacts
    # 署名はarchiveを使う全E2E・browser検査の成功後だけ行う。
    needs: [source, runtime, regression, browser]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # このjobはcheckoutや取得artifact内のcode実行を行わない。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-reports"
          path: ${{ runner.temp }}/attestation-subjects
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attestation-subjects/**/*
          create-storage-record: false
