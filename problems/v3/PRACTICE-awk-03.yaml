schema_version: 3
id: PRACTICE-awk-03
category: PRACTICE
title:
  ja: awk 3
  en: awk 3
statement:
  ja: |
    練習：awk
    awkでinput.txtの2列目と3列目を入れ替えてください。出力は半角スペース1個で区切ってください。
  en: |
    Practice: awk
    Use awk to swap fields 2 and 3 in input.txt. Separate output fields with one ASCII space.
reference_solution: awk '{print $1,$3,$2}' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      A CCC BB
      D FFF EE
      G III HH
      J LLL KK
      M OOO NN
      P RRR QQ
      S UUU TT
      V XXX WW
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    A BB CCC
    D EE FFF
    G HH III
    J KK LLL
    M NN OOO
    P QQ RRR
    S TT UUU
    V WW XXX
