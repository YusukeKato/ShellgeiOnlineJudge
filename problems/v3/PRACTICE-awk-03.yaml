schema_version: 3
id: PRACTICE-awk-03
category: PRACTICE
title:
  ja: awk 3
  en: awk 3
statement:
  ja: |
    練習：awk
    awkコマンドで入力ファイル"input.txt"の2列目と3列目を入れ替えて出力してください。
  en: |
    Exercise: awk
    Swap the second and third columns of the input file "input.txt" and output the result.
reference_solution: cat input.txt | awk '{print $1,$3,$2}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      A CCC BB
      D FFF EE
      G III HH
      J LLL KK
      M OOO NN
      P RRR QQ
      S UUU TT
      V XXX WW
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    A BB CCC
    D EE FFF
    G HH III
    J KK LLL
    M NN OOO
    P QQ RRR
    S TT UUU
    V WW XXX
