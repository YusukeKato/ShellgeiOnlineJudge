schema_version: 3
id: STANDARD-00000005
category: STANDARD
title:
  ja: 入出庫と在庫
  en: Tracking Inventory
statement:
  ja: |
    倉庫にある品物の初期在庫は0個です。
    input.txtの各行には、入出庫の時刻と在庫の増減が記録されています。
    正の数は入庫、負の数は出庫を表します。

    各記録を処理した直後の「時刻 在庫数」を、入力と同じ順序で1行ずつ出力してください。
    時刻と在庫数は半角スペース1個で区切ってください。
  en: |
    The warehouse starts with 0 items in stock.
    Each line of input.txt contains a time and an inventory change.
    Positive numbers are arrivals; negative numbers are departures.

    For each record, output "time stock" after applying that change, in input order, one record per line.
    Separate the time and stock with one ASCII space.
reference_solution: awk '{stock += $2; print $1, stock}' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      09:00 12
      09:10 -5
      09:20 3
      09:30 -10
      10:00 8
      10:15 -2
      10:30 -6
      11:00 4
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    09:00 12
    09:10 7
    09:20 10
    09:30 0
    10:00 8
    10:15 6
    10:30 0
    11:00 4
