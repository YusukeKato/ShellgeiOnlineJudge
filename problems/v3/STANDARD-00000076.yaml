schema_version: 3
id: STANDARD-00000076
category: STANDARD
title:
  ja: レポート本文の取り出し
  en: Extracting the Report Body
statement:
  ja: |
    input.txtは、先頭2行が見出し、末尾2行が付記になっているレポートです。
    見出しと付記を除いた本文だけを出力してください。
    本文の行順、空行、スペース、重複する行はそのまま残してください。
  en: |
    input.txt contains a report with two header lines and two footer lines.
    Output only the body, excluding those four lines.
    Preserve the order, blank lines, spaces, and duplicate lines within the body.
reference_solution: tail -n +3 input.txt | head -n -2
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      Daily report
      2026-10-18
      api  120

      worker 8
      api  120
      END of report
      Generated by report-tool
  exit_code: zero
  stderr: must_be_empty
judge:
  type: text
  expected_output: |
    api  120

    worker 8
    api  120
