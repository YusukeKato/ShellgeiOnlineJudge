schema_version: 3
id: STANDARD-00000051
category: STANDARD
title:
  ja: 打率ランキング
  en: Batting Average Ranking
statement:
  ja: |
    野球選手のデータが与えられるので打率のランキングを降順で出力してください。
    入力は左の列から、選手名、打数、安打数の順で与えられます。
    出力は左の列から、選手名、打率の順で出力してください。
    打率は安打数を打数で割った値で求め、小数点第四位を四捨五入してください。
    打率が同率の場合は選手名の昇順で出力してください。
  en: |
    Given the data of baseball players, please output the batting average ranking in descending order.
    The input is given in the order of player name, number of at-bats, and number of hits from the left column.
    The output should be in the order of player name and batting average from the left column.
    The batting average is calculated by dividing the number of hits by the number of at-bats, and rounding to three decimal places.
    If there is a tie in batting average, please output in ascending order of player names.
reference_solution: cat input.txt | awk '{printf "%s %.3f\n", $1, $3/$2}' | sort -k2,2nr -k1,1
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      Suzuki 600 300
      Kato 220 20
      Sato 450 130
      Okada 500 250
      Iida 411 159
      Tanaka 600 111
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    Okada 0.500
    Suzuki 0.500
    Iida 0.387
    Sato 0.289
    Tanaka 0.185
    Kato 0.091
