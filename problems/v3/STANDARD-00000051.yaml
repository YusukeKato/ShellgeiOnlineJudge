schema_version: 3
id: STANDARD-00000051
category: STANDARD
title:
  ja: 打率ランキング
  en: Batting Average Ranking
statement:
  ja: |
    input.txtの各行は「選手名 打数 安打数」です。
    安打数÷打数を小数点以下3桁に丸めて出力してください。小数点以下4桁目を四捨五入します。

    丸めた打率の高い順に「選手名 打率」を半角スペース1個で区切って出力してください。丸めた値が同じなら、選手名を辞書順に並べてください。
  en: |
    Each line of input.txt is "player at_bats hits".
    Calculate hits / at_bats and round to three decimal places, rounding the fourth decimal digit to the nearest value (5 rounds up).

    Output "player average" separated by one ASCII space, in descending order of the rounded average. Break ties in rounded averages by player name in lexicographic order.
reference_solution: awk '{m=int((2000*$3+$2)/(2*$2));printf "%s %d.%03d\n",$1,int(m/1000),m%1000}' input.txt | sort -k2,2nr -k1,1
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      Suzuki 600 300
      Kato 220 20
      Sato 450 130
      Okada 500 250
      Iida 411 159
      Tanaka 600 111
      Zenda 3 1
      Aoki 1000 333
      Seki 16 1
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    Okada 0.500
    Suzuki 0.500
    Iida 0.387
    Aoki 0.333
    Zenda 0.333
    Sato 0.289
    Tanaka 0.185
    Kato 0.091
    Seki 0.063
