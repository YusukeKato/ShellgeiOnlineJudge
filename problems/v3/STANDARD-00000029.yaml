schema_version: 3
id: STANDARD-00000029
category: STANDARD
title:
  ja: 番号一覧を表にする
  en: Printing Numbers in Columns
statement:
  ja: |
    input.txtの整理番号を、登場順に左から右へ4個ずつ並べて出力してください。
    各番号の間は半角スペース1個で区切ってください。
  en: |
    Arrange the ticket numbers in input.txt into rows of four, left to right in input order.
    Separate numbers with one ASCII space.
reference_solution: paste -d ' ' - - - - < input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      101
      104
      108
      110
      115
      121
      130
      133
      140
      142
      150
      160
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    101 104 108 110
    115 121 130 133
    140 142 150 160
