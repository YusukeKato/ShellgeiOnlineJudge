schema_version: 3
id: PRACTICE-cat-02
category: PRACTICE
title:
  ja: cat 2
  en: cat 2
statement:
  ja: |
    練習：cat
    catでinput.txtの全行に、空行も含めて1から行番号を付けてください。番号は幅6文字に右揃えし、行の内容との間にタブ1個を入れてください。
  en: |
    Practice: cat
    Use cat to number every line of input.txt starting at 1, including empty lines. Right-align each number in six characters, then insert one tab before the original line.
reference_solution: cat -n input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      SHELLGEI

      ONLINE
      JUDGE
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: "     1\tSHELLGEI\n     2\t\n     3\tONLINE\n     4\tJUDGE\n"
