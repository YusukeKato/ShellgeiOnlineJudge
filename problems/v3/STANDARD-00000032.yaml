schema_version: 3
id: STANDARD-00000032
category: STANDARD
title:
  ja: 最小公倍数
  en: Least Common Multiple
statement:
  ja: |
    input.txtのすべての整数で割り切れる、最小の正の整数を出力してください。
  en: |
    Output the least positive integer divisible by every integer in input.txt.
reference_solution: awk 'function gcd(a,b,t){while(b){t=a%b;a=b;b=t}return a} BEGIN{m=1} {m=m/gcd(m,$1)*$1} END{printf "%.0f\n",m}' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      12
      18
      30
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    180
