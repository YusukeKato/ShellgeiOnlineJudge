schema_version: 3
id: STANDARD-00000012
category: STANDARD
title:
  ja: ビットの反転
  en: Bit Inversion
statement:
  ja: |
    input.txtの0を1に、1を0に変えてください。
    文字の順序と改行はそのまま保ってください。
  en: |
    Change every 0 in input.txt to 1, and every 1 to 0.
    Preserve the character order and line breaks.
reference_solution: tr 01 10 < input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      00101
      1111
      0
      101100
      000
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    11010
    0000
    1
    010011
    111
