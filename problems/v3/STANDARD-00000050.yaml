schema_version: 3
id: STANDARD-00000050
category: STANDARD
title:
  ja: 数式の結果を添える
  en: Appending Calculation Results
statement:
  ja: |
    input.txtの各行の末尾の=の後へ、計算結果を半角スペース1個で区切って追加してください。
    数式は整数と+・-・*・/からなり、*と/を先に計算します。除算は小数部分を0の方向へ切り捨てます。
    元の数式と空白はそのまま保ってください。
  en: |
    Append each expression result after the trailing = in input.txt, separated by one ASCII space.
    Expressions contain integers and +, -, *, /. Multiplication and division take precedence. Division truncates the fractional part toward zero.
    Preserve the original expressions and spacing.
reference_solution: paste -d ' ' input.txt <(sed 's/=$//' input.txt | bc)
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      1 + 1 =
      1 + 1 + 1 =
      2 - 1 =
      54 - 2 + 47 =
      10 * 10 =
      10 * 1 * 10 =
      10 * -1 * 10 =
      5 + 5 * 2 =
      8 / 2 =
      8 / 2 * 2 =
      55 + 45 - 100 * 100 / 100 =
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    1 + 1 = 2
    1 + 1 + 1 = 3
    2 - 1 = 1
    54 - 2 + 47 = 99
    10 * 10 = 100
    10 * 1 * 10 = 100
    10 * -1 * 10 = -100
    5 + 5 * 2 = 15
    8 / 2 = 4
    8 / 2 * 2 = 8
    55 + 45 - 100 * 100 / 100 = 0
