schema_version: 3
id: STANDARD-00000011
category: STANDARD
title:
  ja: 行列の回転
  en: Matrix Rotation
statement:
  ja: |
    input.txtの行列を、時計回りに90度回転させてください。
    出力も要素を半角スペース1個で区切り、行列の1行を1行ずつ出力してください。
  en: |
    Rotate the matrix in input.txt 90 degrees clockwise.
    Separate output elements with one ASCII space and output one matrix row per line.
reference_solution: tac input.txt | rs -T | awk '{$1=$1; print}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      1 20 -3
      40 5 60
      7 -80 9
      100 11 12
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    100 7 40 1
    11 -80 5 20
    12 9 60 -3
