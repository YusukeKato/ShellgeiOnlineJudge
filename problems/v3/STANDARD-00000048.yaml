schema_version: 3
id: STANDARD-00000048
category: STANDARD
title:
  ja: 連続する文字の圧縮
  en: Run-Length Encoding
statement:
  ja: |
    input.txtの文字列を、同じ文字が連続する区間ごとに「文字と個数」へ置き換えてください。
    同じ文字でも、間に別の文字が入れば別の区間として数えます。
    結果は区切りなしの1行で出力してください。
  en: |
    Replace each consecutive run of a letter in the line of input.txt with the letter followed by its count.
    Occurrences separated by other letters form different runs.
    Output the result on one line without separators.
reference_solution: tr -d '\n' < input.txt | fold -w1 | uniq -c | awk '{printf "%s%d",$2,$1} END{print ""}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      aaabbacccaa
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    a3b2a1c3a2
