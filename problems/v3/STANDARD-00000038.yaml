schema_version: 3
id: STANDARD-00000038
category: STANDARD
title:
  ja: 割り算判定
  en: Divisibility Check
statement:
  ja: |
    input.txtの各行について、1列目が2列目で割り切れるならYes、それ以外ならNoを、入力順に1行ずつ出力してください。
  en: |
    For each line of input.txt, output Yes if the first number is divisible by the second, or No otherwise, one per line in input order.
reference_solution: 'awk ''{print $1%$2==0 ? "Yes" : "No"}'' input.txt'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      100 10
      99 11
      1001 2
      59 3
      57 3
      1 999
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    Yes
    Yes
    No
    No
    Yes
    No
