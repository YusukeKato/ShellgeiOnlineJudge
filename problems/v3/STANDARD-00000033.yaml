schema_version: 3
id: STANDARD-00000033
category: STANDARD
title:
  ja: 同じ文字の行を数える
  en: Counting a Repeated Character
statement:
  ja: |
    input.txtの各行の文字とその個数を、「文字 個数」の形式で入力順に出力してください。区切りは半角スペース1個です。改行は個数に含めません。
  en: |
    Output the letter and its count on each line of input.txt as "letter count", in input order, separated by one ASCII space. Do not count the newline.
reference_solution: awk '{print substr($0,1,1),length($0)}' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      sssss
      hh
      eeeeeee
      lllllll
      llll
      ggggggggg
      e
      iii
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    s 5
    h 2
    e 7
    l 7
    l 4
    g 9
    e 1
    i 3
