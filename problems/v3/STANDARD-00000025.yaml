schema_version: 3
id: STANDARD-00000025
category: STANDARD
title:
  ja: 文字列の組み合わせ
  en: String Combination
statement:
  ja: |
    AとBとCをそれぞれひとつずつ使用して組み合わせた文字列を全て出力してください。
  en: |
    Output all combined strings using one each of 'A', 'B', and 'C'.
reference_solution: echo {A,B,C}{A,B,C}{A,B,C} | xargs -n1 | awk '{if(substr($0,1,1)!=substr($0,2,1)&&substr($0,1,1)!=substr($0,3,1)&&substr($0,2,1)!=substr($0,3,1)){print $0}}'
execution:
  stdin: ''
  fixtures: []
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    ABC
    ACB
    BAC
    BCA
    CAB
    CBA
