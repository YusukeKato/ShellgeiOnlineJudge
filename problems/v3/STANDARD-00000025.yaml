schema_version: 3
id: STANDARD-00000025
category: STANDARD
title:
  ja: 重複のない並べ方
  en: Permutations Without Repetition
statement:
  ja: |
    A・B・Cを1回ずつ使ってできる3文字の文字列を、すべて出力してください。
    ABCから始まる辞書順で、1行に1つずつ出力してください。
  en: |
    Output every three-letter string using A, B and C exactly once each.
    Output one string per line in lexicographic order, starting with ABC.
reference_solution: printf '%s\n' {A,B,C}{A,B,C}{A,B,C} | grep -Ev '(.).*\1'
execution:
  stdin: ''
  fixtures: []
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    ABC
    ACB
    BAC
    BCA
    CAB
    CBA
