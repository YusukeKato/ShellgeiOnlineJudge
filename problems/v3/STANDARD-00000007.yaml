  en: Pi to 100 Digits
statement:
  ja: |
    円周率を小数点以下100桁まで求めてください。
    101桁目以降は切り捨ててください。
  en: |
    Find pi to 100 decimal places.
    Round down after the 101th digit.
reference_solution: echo "scale=101; 4*a(1)" | bc -l | tr -d '\n' | tr -d '\\' | cut -c 1-102
