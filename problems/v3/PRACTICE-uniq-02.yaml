schema_version: 3
id: PRACTICE-uniq-02
category: PRACTICE
title:
  ja: uniq 2
  en: uniq 2
statement:
  ja: |
    練習：uniq
    sortとuniqでinput.txtの各行が出現する回数を数えてください。行の内容を辞書順に並べ、回数を幅7文字に右揃えし、半角スペース1個の後に行の内容を出力してください。
  en: |
    Practice: uniq
    Use sort and uniq to count occurrences of each line in input.txt. Sort line contents in lexicographic order. Right-align the count in seven characters, followed by one ASCII space and the line contents.
reference_solution: sort input.txt | uniq -c
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      SHELL
      ONLINE
      SHELL
      SHELL
      JUDGE
      ONLINE
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |2
          1 JUDGE
          2 ONLINE
          3 SHELL
