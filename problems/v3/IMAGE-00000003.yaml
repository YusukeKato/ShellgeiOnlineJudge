schema_version: 3
id: IMAGE-00000003
category: IMAGE
title:
  ja: 円
  en: Circle
statement:
  ja: |
    大きさ200x200[px]の赤色の画像の中央に半径50[px]の円を描いてください。
    画像はmedia/output.jpgとして作成してください。
  en: |
    Draw a circle with a radius of 50[px] in the center of the red 200x200[px] image.
    Output image as media/output.jpg.
reference_solution: convert -size 200x200 xc:#FF0000 jpg:- | convert - -draw "circle 100,100 100,150" media/output.jpg
execution:
  stdin: ''
  fixtures: []
  exit_code: ignore
  stderr: merge
judge:
  type: image
  artifact:
    path: media/output.jpg
    media_type: image/jpeg
    max_bytes: 750000
