statement:
  ja: |
    練習：awk
    awkでinput.txtの1・3・5行目のように、奇数番目の行だけを元の順序で出力してください。
  en: |
    Practice: awk
    Use awk to output the odd-numbered lines of input.txt (1, 3, 5, ...), preserving their order.
reference_solution: awk 'NR%2' input.txt
