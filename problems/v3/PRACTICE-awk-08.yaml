schema_version: 3
id: PRACTICE-awk-08
category: PRACTICE
title:
  ja: awk 8
  en: awk 8
statement:
  ja: |
    練習：awk
    awkコマンドで入力ファイル"input.txt"の奇数行だけ出力してください。
  en: |
    Exercise: awk
    Print only the odd lines of the input file "input.txt".
reference_solution: cat input.txt | awk 'NR%2==1'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      tanaka
      yamada
      suzuki
      okamura
      harada
      iida
      takahashi
      nakamura
      kato
      matsuda
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    tanaka
    suzuki
    harada
    takahashi
    kato
