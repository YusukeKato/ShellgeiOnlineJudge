schema_version: 3
id: STANDARD-00000017
category: STANDARD
title:
  ja: 遅いリクエストを探す
  en: Finding Slow Requests
statement:
  ja: |
    input.txtには「リクエストID 応答時間」の形式でログが記録されています。
    応答時間の単位はミリ秒です。

    応答時間が長い順に上位3件の行を出力してください。
    同じ応答時間の行は、入力で先に登場したものを優先してください。
  en: |
    Each line of input.txt is a log record in the form "request_id response_time".
    Response times are in milliseconds.

    Output the three records with the longest response times, from longest to shortest.
    For equal response times, give priority to records that appear earlier in the input.
reference_solution: sort -s -k2,2nr input.txt | head -n 3
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      req-z 900
      req-b 20
      req-c 1200
      req-d 85
      req-y 900
      req-a 900
      req-f 100
      req-g 9
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    req-c 1200
    req-z 900
    req-y 900
