schema_version: 3
id: STANDARD-00000034
category: STANDARD
title:
  ja: 5乗する前の整数
  en: Recovering a Fifth Root
statement:
  ja: |
    input.txtの各行は、ある正の整数xを5乗した値です。元のxを1行ずつ出力してください。
  en: |
    Each line of input.txt is the fifth power of a positive integer x. Output x, one per line.
reference_solution: factor < input.txt | awk '{delete count;for(i=2;i<=NF;i++)count[$i]++;x=1;for(p in count)for(i=0;i<count[p]/5;i++)x*=p;printf "%.0f\n",x}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      7776
      59049
      1048576
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    6
    9
    16
