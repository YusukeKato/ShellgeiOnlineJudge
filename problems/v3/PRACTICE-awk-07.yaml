schema_version: 3
id: PRACTICE-awk-07
category: PRACTICE
title:
  ja: awk 7
  en: awk 7
statement:
  ja: |
    練習：awk
    awkでinput.txtの2行目と3行目を入れ替えてください。それ以外の行と、各行の内容は変えないでください。
  en: |
    Practice: awk
    Use awk to swap lines 2 and 3 of input.txt. Preserve all other lines and the contents of every line.
reference_solution: awk 'NR==2{a=$0} NR==3{print;print a} NR!=2&&NR!=3' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      aaaaa bbbbb ccccc
      ddddd eeeee fffff ggggg hhhhh
      iiiii jjjjj kkkkk lllll mmmmm
      nnnnn ooooo ppppp
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    aaaaa bbbbb ccccc
    iiiii jjjjj kkkkk lllll mmmmm
    ddddd eeeee fffff ggggg hhhhh
    nnnnn ooooo ppppp
