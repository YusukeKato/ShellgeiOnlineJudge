schema_version: 3
id: STANDARD-00000015
category: STANDARD
title:
  ja: 素数判定
  en: Primality Testing
statement:
  ja: |
    input.txtの整数を1行ずつ判定し、素数ならYES、それ以外ならNOを入力と同じ順序で出力してください。
    素数とは、2以上の整数で、正の約数が1と自分自身だけのものです。
  en: |
    For each integer in input.txt, output YES if it is prime, or NO otherwise, one result per line in input order.
    A prime is an integer at least 2 whose only positive divisors are 1 and itself.
reference_solution: 'factor < input.txt | awk ''{print NF==2 ? "YES" : "NO"}'''
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      1
      2
      7
      49
      57
      97
      121
      401
      407
      2635
      7727
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    NO
    YES
    YES
    NO
    NO
    YES
    NO
    YES
    NO
    NO
    YES
