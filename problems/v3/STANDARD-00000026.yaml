schema_version: 3
id: STANDARD-00000026
category: STANDARD
title:
  ja: 迷路の最短距離
  en: Shortest Path Through a Maze
statement:
  ja: |
    input.txtの迷路で、SからGまでの最短の移動回数を出力してください。
    上下左右に1マスずつ移動でき、#は通れません。.とSとGは通れます。
  en: |
    Output the minimum number of moves from S to G in the maze in input.txt.
    Each move goes one cell up, down, left or right. Walls (#) are impassable; ., S and G are passable.
reference_solution: awk '{for(c=1;c<=length;c++){a[NR,c]=substr($0,c,1);if(a[NR,c]=="S"){qr[1]=NR;qc[1]=c;seen[NR,c]=1}}cols=length} END{dr[1]=1;dr[2]=-1;dc[3]=1;dc[4]=-1;tail=1;for(head=1;head<=tail;head++){r=qr[head];c=qc[head];if(a[r,c]=="G"){print dist[r,c]+0;exit}for(k=1;k<=4;k++){x=r+dr[k];y=c+dc[k];if(x>=1&&x<=NR&&y>=1&&y<=cols&&a[x,y]!="#"&&!seen[x,y]){seen[x,y]=1;dist[x,y]=dist[r,c]+1;qr[++tail]=x;qc[tail]=y}}}}' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      G...#
      ###.#
      ....#
      .####
      ...S#
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    13
