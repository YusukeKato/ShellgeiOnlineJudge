    練習：wc
    wcでinput.txtの単語数だけを出力してください。単語はスペース・タブ・改行で区切られています。
  en: |
    Practice: wc
    Use wc to output only the word count of input.txt. Words are separated by spaces, tabs or newlines.
reference_solution: wc -w < input.txt
