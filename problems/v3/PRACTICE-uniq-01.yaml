  en: uniq 1
statement:
  ja: |
    練習：uniq
    sortとuniqでinput.txtの重複行を除き、辞書順で出力してください。
  en: |
    Practice: uniq
    Use sort and uniq to remove duplicate lines from input.txt and output them in lexicographic order.
reference_solution: sort input.txt | uniq
