schema_version: 3
id: STANDARD-00000049
category: STANDARD
title:
  ja: 最長の回文部分文字列
  en: Longest Palindromic Substring
statement:
  ja: |
    input.txtの各行から、連続した部分文字列のうち最も長い回文を1つ出力してください。
    回文とは、前後どちらから読んでも同じ文字列です。同じ最大長の候補が複数ある場合は、最も左から始まるものを選んでください。
    1文字も回文として扱います。
  en: |
    For each line of input.txt, output its longest contiguous palindromic substring.
    A palindrome reads the same forwards and backwards. If several candidates have the maximum length, choose the one starting furthest left.
    A single letter is also a palindrome.
reference_solution: awk '{best=substr($0,1,1);start=1;for(c=1;c<=length;c++)for(e=0;e<=1;e++){l=c;r=c+e;while(l>=1&&r<=length&&substr($0,l,1)==substr($0,r,1)){n=r-l+1;if(n>length(best)||(n==length(best)&&l<start)){best=substr($0,l,n);start=l}l--;r++}}print best}' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      abba
      aba
      zracecar
      babad
      x
      abc
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    abba
    aba
    racecar
    bab
    x
    a
