schema_version: 3
id: STANDARD-00000049
category: STANDARD
title:
  ja: 最大文字数の回文調査
  en: Maximum Length Palindrome Search
statement:
  ja: |
    文字列の中から最大文字数の回文を探して出力してください。
  en: |
    Find and output the longest palindrome from the string.
reference_solution: cat input.txt | awk '{a="";b=0;for(i=1;i<length($0);i++){ for(j=1;i-j>=1&&i+j<length($0);j++){if(substr($0,i+j,1)==substr($0,i-j,1)&&b<j){b=j;a=substr($0,i-j,j*2+1)}else{break}} };print a}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      wdimabbzapplelppaoqeehhhgpqcn
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    applelppa
