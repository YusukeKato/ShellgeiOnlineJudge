category: STANDARD
title:
  ja: 足し算
  en: Addition
statement:
  ja: |
    各行において、並んでいる数字を足し合わせた合計を出力してください。
  en: |
    Output the sum of the numbers in the line.
reference_solution: cat input.txt | awk '{a=0;for(i=1;i<=NF;i++){a+=$i};print a}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      1 2 3
      2 2 2 2
      3 3
      5 4 3 2 1
      9
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    6
    8
    6
    15
    9
