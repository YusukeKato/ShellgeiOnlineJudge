schema_version: 3
id: STANDARD-00000036
category: STANDARD
title:
  ja: NをN回出力
  en: Output N N Times
statement:
  ja: |
    input.txtの各行の整数Nを、1行に1個ずつN回出力してください。
    入力順に処理し、結果の間に空行は入れないでください。
  en: |
    For each integer N in input.txt, output N on its own line N times.
    Process input lines in order with no blank lines between results.
reference_solution: awk '{for(i=0;i<$1;i++)print $1}' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      1
      10
      2
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    1
    10
    10
    10
    10
    10
    10
    10
    10
    10
    10
    2
    2
