schema_version: 3
id: STANDARD-00000046
category: STANDARD
title:
  ja: 単位行列の生成
  en: Generating Identity Matrices
statement:
  ja: |
    input.txtの各整数Nについて、N行N列の単位行列を出力してください。
    左上から右下への対角線上は1、それ以外は0です。各行の数字は区切らず、行列どうしの間にも空行は入れないでください。
  en: |
    For each integer N in input.txt, output an N x N identity matrix.
    The diagonal from top left to bottom right contains 1; all other entries are 0. Use no separators within rows and no blank lines between matrices.
reference_solution: cat input.txt | awk '{for(i=0;i<$1;i++){for(j=0;j<$1;j++){if(i==j){printf("1")}else{printf("0")}}printf("\n")}}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      3
      5
      2
      4
      6
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    100
    010
    001
    10000
    01000
    00100
    00010
    00001
    10
    01
    1000
    0100
