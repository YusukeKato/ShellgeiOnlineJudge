schema_version: 3
id: STANDARD-00000043
category: STANDARD
title:
  ja: 拡張子を付けた名前
  en: Names with Extensions
statement:
  ja: |
    input.txtの各行の末尾に.pngを付けた文字列と、.jpgを付けた文字列を、この順に半角スペース1個で区切って出力してください。
  en: |
    For each line of input.txt, output the name followed by .png and the name followed by .jpg, in that order, separated by one ASCII space.
reference_solution: sed 's/.*/&.png &.jpg/' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      shellgei
      online
      judge
      apple
      20240825_01
      20240825_02
      20240825_03
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    shellgei.png shellgei.jpg
    online.png online.jpg
    judge.png judge.jpg
    apple.png apple.jpg
    20240825_01.png 20240825_01.jpg
    20240825_02.png 20240825_02.jpg
    20240825_03.png 20240825_03.jpg
