schema_version: 3
id: STANDARD-00000044
category: STANDARD
title:
  ja: 文字列を含むファイル
  en: Files Containing a String
statement:
  ja: |
    /ShellGeiData/vol.68以下の通常ファイルから、文字列entrepreneurialを含むファイルを探してください。
    出力するのはディレクトリを除いたファイル名です。複数ある場合は辞書順に並べ、同じ名前は1回だけ出力してください。
  en: |
    Find regular files under /ShellGeiData/vol.68 that contain the literal string entrepreneurial.
    Output only basenames, without directories. Sort multiple names in lexicographic order and output each name once.
reference_solution: find /ShellGeiData/vol.68 -type f -exec grep -Fl entrepreneurial {} + | sed 's|.*/||' | sort -u
execution:
  stdin: ''
  fixtures: []
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    words3.txt
