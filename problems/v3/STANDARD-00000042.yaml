schema_version: 3
id: STANDARD-00000042
category: STANDARD
title:
  ja: 桁を揃えた表
  en: Aligned Inventory Table
statement:
  ja: |
    input.txtは「商品名 個数」の一覧です。
    商品名を幅8文字で左揃え、個数を幅4文字で右揃えにし、その間を「 | 」で区切って入力順に出力してください。
    幅の不足分は半角スペースで埋めてください。
  en: |
    input.txt lists "item quantity" pairs.
    Left-align names in a field of width 8 and right-align quantities in a field of width 4, separated by " | ", in input order.
    Pad fields with ASCII spaces.
reference_solution: awk '{printf "%-8s | %4d\n",$1,$2}' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      apple 7
      melon 120
      fig 3
      pear 42
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    apple    |    7
    melon    |  120
    fig      |    3
    pear     |   42
