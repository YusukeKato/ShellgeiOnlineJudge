schema_version: 3
id: STANDARD-00000041
category: STANDARD
title:
  ja: 魔方陣の空欄
  en: Missing Value in a Magic Square
statement:
  ja: |
    input.txtは、縦・横・2本の対角線の各合計がすべて等しい3×3の魔方陣です。
    1か所のxを整数で埋めて、完成した行列を出力してください。
    要素は半角スペース1個で区切ってください。
  en: |
    input.txt is a 3 x 3 magic square: every row, column and the two diagonals have the same sum.
    Replace the single x with an integer and output the completed matrix.
    Separate elements with one ASCII space.
reference_solution: awk '{s=0;missing=0;for(c=1;c<=NF;c++){a[NR,c]=$c;if($c=="x"){xr=NR;xc=c;missing=1}else s+=$c}if(!missing)total=s} END{s=0;for(c=1;c<=3;c++)if(c!=xc)s+=a[xr,c];a[xr,xc]=total-s;for(r=1;r<=3;r++)print a[r,1],a[r,2],a[r,3]}' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      8 1 6
      3 5 7
      4 9 x
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    8 1 6
    3 5 7
    4 9 2
