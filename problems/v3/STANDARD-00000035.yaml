schema_version: 3
id: STANDARD-00000035
category: STANDARD
title:
  ja: 行の複製
  en: Duplicating Lines
statement:
  ja: |
    input.txtの各行を、同じ内容で連続する2行として出力してください。
    行内の空白もそのまま保ってください。
  en: |
    Output each line of input.txt twice consecutively, preserving its contents including spaces.
reference_solution: sed p input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      shellgei
      hello world
      keep  spaces
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    shellgei
    shellgei
    hello world
    hello world
    keep  spaces
    keep  spaces
