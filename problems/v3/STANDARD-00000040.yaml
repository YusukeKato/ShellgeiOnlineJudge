schema_version: 3
id: STANDARD-00000040
category: STANDARD
title:
  ja: 文字の出現回数
  en: Character Frequencies
statement:
  ja: |
    input.txtの文字列全体について、a・b・cの出現回数を数えてください。
    a、b、cの順に「文字 回数」を半角スペース1個で区切って出力してください。現れない文字も0回として出力してください。
  en: |
    Count a, b and c across all of input.txt.
    Output "letter count" in a, b, c order, separated by one ASCII space. Include absent letters with a count of zero.
reference_solution: tr -d '\n' < input.txt | fold -w1 | sort | uniq -c | awk '{n[$2]=$1} END{split("a b c",a);for(i=1;i<=3;i++)print a[i],n[a[i]]+0}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      acaa
      ccac
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    a 4
    b 0
    c 4
