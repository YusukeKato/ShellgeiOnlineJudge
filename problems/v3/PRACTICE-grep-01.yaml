schema_version: 3
id: PRACTICE-grep-01
category: PRACTICE
title:
  ja: grep 1
  en: grep 1
statement:
  ja: |
    練習：grep
    grepコマンドで入力ファイル"input.txt"から拡張子".jpg"が付いた行だけを出力してください。
  en: |
    Exercise: grep
    Output only the lines from the input file "input.txt" with the extension ".jpg".
reference_solution: cat input.txt | grep ".jpg"
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      file_01.txt
      file_02.txt
      file_03.png
      file_05.c
      file_06.cpp
      file_09
      file_10.jpg
      file_11.png
      file_12.jpg
      file_13.txt
      file_15.py
      file_16.php
      file_18.jpg
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    file_10.jpg
    file_12.jpg
    file_18.jpg
