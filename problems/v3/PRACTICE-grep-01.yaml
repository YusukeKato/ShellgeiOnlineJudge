schema_version: 3
id: PRACTICE-grep-01
category: PRACTICE
title:
  ja: grep 1
  en: grep 1
statement:
  ja: |
    練習：grep
    grepでinput.txtから、文字列.jpgを含む行を元の順序で出力してください。行末でなくても対象です。
  en: |
    Practice: grep
    Use grep to output lines of input.txt containing the literal string .jpg, in input order. The string need not be at the end.
reference_solution: grep -F '.jpg' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      photoXjpg
      photo.jpg.bak
      photo.jpg
      photo.png
      photoXpng
      photo.png.old
      notes.txt
      notes.txt.bak
      notesXtxt
      README
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    photo.jpg.bak
    photo.jpg
