schema_version: 3
id: STANDARD-00000045
category: STANDARD
title:
  ja: 模様を3倍に拡大
  en: Enlarging a Pattern
statement:
  ja: |
    input.txtの模様を、縦横それぞれ3倍に拡大してください。
    各文字を横に3個並べ、その行を縦に3回出力します。
  en: |
    Enlarge the pattern in input.txt by a factor of three horizontally and vertically.
    Repeat each character three times across, then output that expanded row three times.
reference_solution: sed 's/./&&&/g;p;p' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      21
      34
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    222111
    222111
    222111
    333444
    333444
    333444
