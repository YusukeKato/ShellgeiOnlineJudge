schema_version: 3
id: STANDARD-00000024
category: STANDARD
title:
  ja: 在庫と注文の照合
  en: Stock and Orders
statement:
  ja: |
    input.txtの各行は「種類 品目 個数」です。stockは在庫、orderは注文を表します。
    在庫の記録がない品目の在庫は0個です。

    注文数が在庫数を超える品目について「品目 不足数」を品目のa〜z順で出力してください。区切りは半角スペース1個です。
  en: |
    Each line of input.txt is "kind item quantity": stock records inventory and order records an order.
    An item without a stock record has zero stock.

    For orders exceeding stock, output "item shortage" in a-to-z item order, separated by one ASCII space.
reference_solution: join -a2 -e0 -o0,1.2,2.2 <(sed -n 's/^stock //p' input.txt | sort -k1,1) <(sed -n 's/^order //p' input.txt | sort -k1,1) | awk '$3>$2{print $1,$3-$2}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      stock bolt 8
      order nut 9
      stock washer 20
      order bolt 5
      stock nut 3
      order clip 4
      stock screw 6
      order screw 6
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    clip 4
    nut 6
