schema_version: 3
id: STANDARD-00000052
category: STANDARD
title:
  ja: 未受付の予約者
  en: Reserved but Not Checked In
statement:
  ja: |
    イベントの予約と受付の記録がinput.txtにあります。
    各行は「種類 名前」です。
    reservedは予約、arrivedは受付済みを表します。同じ名前は同じ人です。

    予約記録があり、受付記録がない人の名前を出力してください。
    名前は1行に1つ、重複なしで、アルファベットの辞書順に並べてください。
  en: |
    input.txt contains reservation and check-in records for an event.
    Each line is "type name".
    reserved means a reservation; arrived means a completed check-in.
    The same name always identifies the same person.

    Output the names that have a reservation record but no check-in record.
    Print each name once, one per line, in alphabetical dictionary order.
reference_solution: cat input.txt | awk '{print $2,$1}' | sort -u | awk '!seen[$1]++ && $2=="reserved"{print $1}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      reserved haru
      arrived sora
      reserved akiko
      reserved sora
      arrived guest
      reserved mio
      reserved ren
      arrived aki
      reserved yui
      arrived ren
      reserved haru
      arrived aki
      reserved kei
      arrived mio
      reserved nao
      arrived kei
      reserved aki
  exit_code: zero
  stderr: must_be_empty
judge:
  type: text
  expected_output: |
    akiko
    haru
    nao
    yui
