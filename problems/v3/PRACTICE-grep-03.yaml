schema_version: 3
id: PRACTICE-grep-03
category: PRACTICE
title:
  ja: grep 3
  en: grep 3
statement:
  ja: |
    練習：grep
    grepでinput.txtから、.txtで終わらない行を元の順序で出力してください。
  en: |
    Practice: grep
    Use grep to output lines of input.txt that do not end in .txt, in input order.
reference_solution: grep -v '\.txt$' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      photoXjpg
      photo.jpg.bak
      photo.jpg
      photo.png
      photoXpng
      photo.png.old
      notes.txt
      notes.txt.bak
      notesXtxt
      README
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    photoXjpg
    photo.jpg.bak
    photo.jpg
    photo.png
    photoXpng
    photo.png.old
    notes.txt.bak
    notesXtxt
    README
