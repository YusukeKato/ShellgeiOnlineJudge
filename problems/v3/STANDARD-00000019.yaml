schema_version: 3
id: STANDARD-00000019
category: STANDARD
title:
  ja: 元の文字列
  en: Original String
statement:
  ja: |
    各行の文字列は、それぞれとある文字列を三回繰り返して生成されました。
    繰り返されている文字列を出力してください。
  en: |
    Each line of string was generated by repeating a certain string three times.
    Output the repeated string.
reference_solution: cat input.txt | awk '{print substr($0,1,length($0)/3)}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      ABCABCABC
      AAA
      ZAZAZA
      SHELLGEISHELLGEISHELLGEI
      GGGGGG
      ZAZZAZZAZ
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    ABC
    A
    ZA
    SHELLGEI
    GG
    ZAZ
