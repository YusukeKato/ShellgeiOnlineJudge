schema_version: 3
id: PRACTICE-awk-06
category: PRACTICE
title:
  ja: awk 6
  en: awk 6
statement:
  ja: |
    練習：awk
    awkでinput.txtの各整数について、偶数ならEVEN、奇数ならODDを1行ずつ出力してください。
  en: |
    Practice: awk
    Use awk to output EVEN for each even integer in input.txt and ODD for each odd integer, one result per line.
reference_solution: 'awk ''{print $1%2 ? "ODD" : "EVEN"}'' input.txt'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      0
      1
      2
      5
      9
      12
      77
      88
      100
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    EVEN
    ODD
    EVEN
    ODD
    ODD
    EVEN
    ODD
    EVEN
    EVEN
