schema_version: 3
id: STANDARD-00000008
category: STANDARD
title:
  ja: 鶴亀算
  en: Crane and Turtle Problem
statement:
  ja: |
    鶴亀算を行ってください。
    入力の一列目の値は鶴と亀の合計、二列目の値は足の数の合計です。
    出力の一列目は鶴の数、二列目は亀の数としてください。
    ただし、鶴の足は二本、亀の足は四本とします。
  en: |
    Input:
    - first column: the sum of cranes and turtles
    - second column: the sum of the number of legs
    Output:
    - first column: the number of cranes
    - second column: the number of turtles

    Assume cranes have two legs and turtles have four.
reference_solution: cat input.txt | awk '{for(i=0;i<10;i++){for(j=0;j<10;j++){if(i+j==$1&&i*2+j*4==$2){print i, j}}}}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      6 20
      10 30
      2 6
      11 28
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    2 4
    5 5
    1 1
    8 3
