schema_version: 3
id: STANDARD-00000008
category: STANDARD
title:
  ja: 鶴亀算
  en: Cranes and Turtles
statement:
  ja: |
    鶴は足が2本、亀は足が4本あります。
    input.txtの各行には、鶴と亀の合計匹数と、足の合計本数が記録されています。

    各行について「鶴の匹数 亀の匹数」を、入力と同じ順序で1行ずつ出力してください。
    2つの数は半角スペース1個で区切ってください。
  en: |
    A crane has 2 legs, and a turtle has 4 legs.
    Each line of input.txt contains the total number of animals and the total number of legs.

    For each input line, output "cranes turtles" in input order, one pair per line.
    Separate the counts with one ASCII space.
reference_solution: awk '{turtles = ($2 - 2*$1) / 2; print $1 - turtles, turtles}' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      6 20
      10 30
      2 6
      11 28
      12 24
      15 60
      30 84
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    2 4
    5 5
    1 1
    8 3
    12 0
    0 15
    18 12
