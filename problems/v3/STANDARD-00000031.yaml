schema_version: 3
id: STANDARD-00000031
category: STANDARD
title:
  ja: 最大公約数
  en: Greatest Common Divisor
statement:
  ja: |
    input.txtのすべての整数を割り切れる、最大の正の整数を出力してください。
  en: |
    Output the greatest positive integer that divides every integer in input.txt.
reference_solution: awk 'function gcd(a,b,t){while(b){t=a%b;a=b;b=t}return a} {g=gcd(g,$1)} END{print g}' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      12
      18
      30
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    6
