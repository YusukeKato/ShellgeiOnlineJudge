category: STANDARD
title:
  ja: 最大公約数
  en: Greatest Common Divisor
statement:
  ja: |
    最大公約数を求めてください。
  en: |
    Find the greatest common divisor.
reference_solution: cat input.txt | xargs | awk '{a=0;for(i=1;i<=1024;i++){if($1%i==0&&$2%i==0&&$3%i==0){a=i}};print a}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      256
      512
      1024
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    256
