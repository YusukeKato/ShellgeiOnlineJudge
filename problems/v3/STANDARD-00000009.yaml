schema_version: 3
id: STANDARD-00000009
category: STANDARD
title:
  ja: 日記の並べ替え
  en: Diary Rearrangement
statement:
  ja: |
    日記を時系列順に並び替えてください。
  en: |
    Sort the diary in chronological order.
reference_solution: cat input.txt | xargs | sed -E 's;([0-9]*/[0-9]*/[0-9]*);\n\1;g' | sort -r -k 1,1 | awk '{for(i=1;i<=NF;i++){print $i};printf("\n")}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      2023/05/05
      海へ行きました
      楽しかったです

      2030/04/01
      自転車購入

      2022/01/01
      正月は楽しいなぁ

      1998/12/24
      クリスマスって今日だっけ？
      明日かもしれない
      カレンダーを確認しよう

      2023/06/24
      晴れ
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    2030/04/01
    自転車購入

    2023/06/24
    晴れ

    2023/05/05
    海へ行きました
    楽しかったです

    2022/01/01
    正月は楽しいなぁ

    1998/12/24
    クリスマスって今日だっけ？
    明日かもしれない
    カレンダーを確認しよう
