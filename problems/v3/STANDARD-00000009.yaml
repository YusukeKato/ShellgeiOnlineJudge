schema_version: 3
id: STANDARD-00000009
category: STANDARD
title:
  ja: 日記の並べ替え
  en: Sorting Diary Entries
statement:
  ja: |
    input.txtの日記を、日付の新しいものから古いものへ並べ替えてください。

    各日記は、日付1行と本文1行以上で構成され、日記どうしは空行1行で区切られています。

    各日記の日付と本文は、文字・空白・改行を変更せずに保ってください。
    出力でも日記どうしを空行1行で区切ってください。
  en: |
    Sort the diary entries in input.txt from newest to oldest.

    Each entry consists of one date line followed by one or more body lines. Entries are separated by one empty line.

    Preserve the date and body of each entry, including all characters, spaces, and line breaks.
    Separate output entries with one empty line.
reference_solution: awk 'BEGIN {RS=""; ORS="\0"} {print $0 "\n"}' input.txt | sort -zr | tr '\0' '\n'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      2023/05/05
      海へ行きました
      集合場所は Blue Cafe

      2030/04/01
      自転車購入
      メモ：2023/05/05 の写真を整理

      2022/01/01
      今年の目標：read  more books

      1998/12/24
      クリスマスって今日だっけ？
      明日かもしれない
      カレンダーを確認しよう

      2023/06/24
      晴れ
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    2030/04/01
    自転車購入
    メモ：2023/05/05 の写真を整理

    2023/06/24
    晴れ

    2023/05/05
    海へ行きました
    集合場所は Blue Cafe

    2022/01/01
    今年の目標：read  more books

    1998/12/24
    クリスマスって今日だっけ？
    明日かもしれない
    カレンダーを確認しよう
