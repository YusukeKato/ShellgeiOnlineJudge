schema_version: 3
id: STANDARD-00000014
category: STANDARD
title:
  ja: グループ分け
  en: Grouping by Team
statement:
  ja: |
    input.txtのメンバーをチームごとにまとめてください。
    各行は「名前 チーム番号」です。

    チーム番号の小さい順に、1チームを1行で出力してください。
    各行は「チーム番号 名前 名前 ...」とし、同じチームの名前は入力で登場した順に並べてください。
    項目は半角スペース1個で区切ってください。
  en: |
    Group the members in input.txt by team.
    Each line is "name team_number".

    Output one team per line in ascending numeric order of team number.
    Use "team_number name name ...", keeping names within each team in their original input order.
    Separate fields with one ASCII space.
reference_solution: sort -s -k2,2n input.txt | awk '$2!=team {if(NR>1) printf "\n"; team=$2; printf "%s",team} {printf " %s",$1} END {print ""}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      田中 10
      鈴木 2
      二階堂 2
      佐藤 5
      加藤 2
      大久保 10
      米田 5
      森 10
      大谷 20
      源田 20
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    2 鈴木 二階堂 加藤
    5 佐藤 米田
    10 田中 大久保 森
    20 大谷 源田
