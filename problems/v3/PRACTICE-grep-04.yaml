schema_version: 3
id: PRACTICE-grep-04
category: PRACTICE
title:
  ja: grep 4
  en: grep 4
statement:
  ja: |
    練習：grep
    grepでinput.txtから、.jpgで終わる行を元の順序で出力してください。
  en: |
    Practice: grep
    Use grep to output lines of input.txt ending in .jpg, in input order.
reference_solution: grep '\.jpg$' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      photoXjpg
      photo.jpg.bak
      photo.jpg
      photo.png
      photoXpng
      photo.png.old
      notes.txt
      notes.txt.bak
      notesXtxt
      README
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    photo.jpg
