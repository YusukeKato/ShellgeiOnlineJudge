schema_version: 3
id: PRACTICE-find-03
category: PRACTICE
title:
  ja: find 3
  en: find 3
statement:
  ja: |
    練習：find
    findで/ShellGeiData/sd201701以下を再帰的に探し、名前がdangerousで始まる通常ファイルの絶対パスだけを列挙してください。
    結果は辞書順で1行ずつ出力してください。
    使用データ：https://github.com/ryuichiueda/ShellGeiData/tree/master/sd201701
  en: |
    Practice: find
    Use find to recursively search /ShellGeiData/sd201701 and list only absolute paths of regular files whose names start with dangerous.
    Output one path per line in lexicographic order.
    Data: https://github.com/ryuichiueda/ShellGeiData/tree/master/sd201701
reference_solution: find /ShellGeiData/sd201701 -type f -name 'dangerous*' | sort
execution:
  stdin: ''
  fixtures: []
  exit_code: ignore
  stderr: merge
