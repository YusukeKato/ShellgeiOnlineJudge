schema_version: 3
id: STANDARD-00000037
category: STANDARD
title:
  ja: 数字のまとまりを抽出
  en: Extracting Digit Sequences
statement:
  ja: |
    input.txtから、連続する半角数字を1つのまとまりとして抽出し、登場順に1行ずつ出力してください。
    符号や小数点は数字に含めません。
  en: |
    Extract each contiguous sequence of ASCII digits from input.txt, one per line in order of appearance.
    Signs and decimal points are not part of a digit sequence.
reference_solution: grep -oE '[0-9]+' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      今日は2023年10月1日です。
      公園を散歩中に犬を3匹見かけました。
      空には雲は5つ、太陽は2つありました。
      夜になると月が4つ出てきてちょっと怖かったです。
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    2023
    10
    1
    3
    5
    2
    4
