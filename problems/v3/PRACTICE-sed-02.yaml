schema_version: 3
id: PRACTICE-sed-02
category: PRACTICE
title:
  ja: sed 2
  en: sed 2
statement:
  ja: |
    練習：sed
    sedでinput.txtにあるすべてのXXXをSHELLGEIに、すべてのYYYをONLINEに置換してください。
  en: |
    Practice: sed
    Use sed to replace every XXX with SHELLGEI and every YYY with ONLINE in input.txt.
reference_solution: sed 's/XXX/SHELLGEI/g;s/YYY/ONLINE/g' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      XXX YYY XXX YYY JUDGE
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    SHELLGEI ONLINE SHELLGEI ONLINE JUDGE
