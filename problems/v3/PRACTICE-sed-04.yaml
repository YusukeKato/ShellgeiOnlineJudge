schema_version: 3
id: PRACTICE-sed-04
category: PRACTICE
title:
  ja: sed 4
  en: sed 4
statement:
  ja: |
    練習：sed
    sedでinput.txtから、半角数字だけでできた行を削除してください。それ以外の行は元の順序で残してください。
  en: |
    Practice: sed
    Use sed to delete lines of input.txt consisting entirely of ASCII digits. Preserve all other lines in their original order.
reference_solution: sed -E '/^[0-9]+$/d' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      29383846
      SHELLGEI
      file2
      001122
      ONLINE
      JUDGE
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    SHELLGEI
    file2
    ONLINE
    JUDGE
