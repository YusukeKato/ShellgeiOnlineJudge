title:
  ja: 大きな整数の桁数
  en: Digits in a Large Integer
statement:
  ja: |
    2の1024乗を十進数で表したときの桁数を出力してください。
    改行や計算結果の折り返し記号は桁数に含めません。
  en: |
    Output the number of decimal digits in 2 raised to the power of 1024.
    Do not count newlines or continuation markers in a wrapped calculation result.
reference_solution: printf '2^1024\n' | bc | tr -d '\\\n' | wc -c
