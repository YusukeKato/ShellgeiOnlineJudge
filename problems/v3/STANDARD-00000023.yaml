schema_version: 3
id: STANDARD-00000023
category: STANDARD
title:
  ja: スコア計算
  en: Score Calculation
statement:
  ja: |
    AとBとCは1点、DとEは2点、Fは3点です。
    各行において、点数の合計を出力してください。
  en: |
    A, B and C are worth 1 point, D and E are worth 2 points, and F is worth 3 points.
    In each line, output the total number of points.
reference_solution: cat input.txt | awk '{z=0;for(i=1;i<=length($0);i++){a=substr($0,i,1);if(a=="A"||a=="B"||a=="C"){z+=1}else if(a=="D"||a=="E"){z+=2}else{z+=3}};print z}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      A
      AA
      ABC
      AD
      DC
      FF
      ABCDEF
      FFDDEE
      AAAAAAAAAA
      FFFFFFFFFF
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    1
    2
    3
    3
    3
    6
    10
    14
    10
    30
