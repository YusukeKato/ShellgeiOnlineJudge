category: STANDARD
title:
  ja: スコア計算
  en: Score Calculation
statement:
  ja: |
    A・B・Cは1点、D・Eは2点、Fは3点です。
    input.txtの各行について、合計点を入力と同じ順序で1行ずつ出力してください。
  en: |
    A, B and C are worth 1 point, D and E 2 points, and F 3 points.
    Output the total score for each line of input.txt, one per line in input order.
reference_solution: tr ABCDEF 111223 < input.txt | sed 's/./&+/g; s/+$//' | bc
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      A
      AA
      ABC
      AD
      DC
      FF
      ABCDEF
      FFDDEE
      AAAAAAAAAA
      FFFFFFFFFF
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    1
    2
    3
    3
    3
    6
    10
    14
    10
    30
