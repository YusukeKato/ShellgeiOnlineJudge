schema_version: 3
id: STANDARD-00000021
category: STANDARD
title:
  ja: 回文判定
  en: Palindrome
statement:
  ja: |
    各行の文字列が回文なら"YES"を、回文ではないなら"NO"を出力してください。
  en: |
    Output "YES" if the string in each line is a palindrome, or "NO" if it is not a palindrome.
reference_solution: cat input.txt | awk '{a=0;for(i=1;i<length($0);i++){if(substr($0,i,1)!=substr($0,length($0)-i+1,1)){a=1}};if(a==0){print "YES"}else{print "NO"}}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      AA
      BBB
      CBB
      CCBB
      CBBC
      ABCABC
      YES
      ABCDCBA
      EEFFEEE
      ABCDEFGHIJKLMNOPQRSTUVWXYZZYXWVUTSRQPONMLKJIHGFEDCBA
      ABCDEFGHIJKLMNOPQRSTUVWXYZAZYXWVUTSRQPONMLKJIHGFEDCBA
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    YES
    YES
    NO
    NO
    YES
    NO
    NO
    YES
    NO
    YES
    YES
