schema_version: 3
id: STANDARD-00000021
category: STANDARD
title:
  ja: 回文判定
  en: Palindrome Check
statement:
  ja: |
    input.txtの各行が、前から読んでも後ろから読んでも同じ文字列ならYES、それ以外ならNOを出力してください。
    結果は入力と同じ順序で1行ずつ出力してください。
  en: |
    For each line of input.txt, output YES if it reads the same forwards and backwards, or NO otherwise.
    Output one result per line in input order.
reference_solution: 'paste input.txt <(rev input.txt) | awk ''{print $1==$2 ? "YES" : "NO"}'''
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      A
      ABBA
      ABCA
      LEVEL
      SHELL
      ABCBA
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    YES
    YES
    NO
    YES
    NO
    YES
