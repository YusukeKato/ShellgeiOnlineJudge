title:
  ja: cat 3
  en: cat 3
statement:
  ja: |
    練習：cat
    catでinput.txtの各行の末尾に$を表示してください。空行と行末のスペースもそのまま残してください。
  en: |
    Practice: cat
    Use cat to display $ at the end of every line of input.txt. Preserve empty lines and trailing spaces.
reference_solution: cat -E input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: "SHELLGEI  \n\nONLINE\nJUDGE\n"
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    SHELLGEI  $
    $
    ONLINE$
    JUDGE$
