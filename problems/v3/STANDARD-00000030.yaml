schema_version: 3
id: STANDARD-00000030
category: STANDARD
title:
  ja: シーザー暗号
  en: Caesar Cipher
statement:
  ja: |
    input.txtの暗号文を復号してください。各大文字英字をアルファベット順に8文字戻します。Aの前はZに戻ります。
    例えばIはA、AはSになります。空白と改行はそのまま保ってください。
  en: |
    Decode input.txt by shifting each uppercase ASCII letter eight positions backwards in the alphabet, wrapping before A to Z.
    For example, I becomes A and A becomes S. Preserve spaces and newlines.
reference_solution: tr 'A-Z' 'S-ZA-R' < input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      APMTT OMQ
      IJK ZAB
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    SHELL GEI
    ABC RST
