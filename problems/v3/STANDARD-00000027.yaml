schema_version: 3
id: STANDARD-00000027
category: STANDARD
title:
  ja: 電車の乗り換え
  en: Train Connections
statement:
  ja: |
    8:00にA駅にいるとき、D駅へ到着できる最も早い時刻を出力してください。
    input.txtは「出発駅 到着駅 発時刻 着時刻」の時刻表です。すべて同じ日の時刻です。
    到着と同時刻の電車にも乗れます。
    出力はH:MM形式とし、時は先頭に0を付けず、分は2桁にしてください。
  en: |
    Starting at station A at 8:00, output the earliest possible arrival time at station D.
    Each line of input.txt is "origin destination departure arrival". All times are on the same day.
    Transfers at the exact arrival time are allowed.
    Output H:MM with no leading zero on the hour and two digits for minutes.
reference_solution: awk '{split($3,d,":");split($4,a,":");print $1,$2,d[1]*60+d[2],a[1]*60+a[2]}' input.txt | sort -k3,3n | awk 'BEGIN{t["A"]=480} ($1 in t)&&t[$1]<=$3&&(!($2 in t)||$4<t[$2]){t[$2]=$4} END{printf "%d:%02d\n",int(t["D"]/60),t["D"]%60}'
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      C D 9:10 9:40
      B D 8:36 9:59
      A C 8:00 9:05
      C D 8:30 9:00
      A B 8:00 8:32
      B C 8:32 9:02
      A D 8:00 10:11
      C D 9:02 9:20
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    9:20
