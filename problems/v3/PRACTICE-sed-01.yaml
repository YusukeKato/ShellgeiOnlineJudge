    練習：sed
    sedでinput.txtにあるすべてのXXXをSHELLGEIに置換してください。
  en: |
    Practice: sed
    Use sed to replace every occurrence of XXX in input.txt with SHELLGEI.
reference_solution: sed 's/XXX/SHELLGEI/g' input.txt
