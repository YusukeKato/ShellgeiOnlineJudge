schema_version: 3
id: PRACTICE-sed-05
category: PRACTICE
title:
  ja: sed 5
  en: sed 5
statement:
  ja: |
    練習：sed、正規表現
    sedコマンドで入力ファイル"input.txt"の数字の行だけを出力してください。
  en: |
    Exercise: sed, Regular Expression
    Output only the lines that contain numbers in the input file "input.txt".
reference_solution: cat input.txt | sed -n "/[0-9]/p"
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      1
      22
      SHELLGEI
      333
      4444
      55555
      666666
      7777777
      ONLINE
      88888888
      JUDGE
      999999999
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    1
    22
    333
    4444
    55555
    666666
    7777777
    88888888
    999999999
