schema_version: 3
id: PRACTICE-sed-05
category: PRACTICE
title:
  ja: sed 5
  en: sed 5
statement:
  ja: |
    練習：sed
    sedでinput.txtから、半角数字を1文字以上含む行だけを元の順序で出力してください。
  en: |
    Practice: sed
    Use sed to output only lines of input.txt containing at least one ASCII digit, in their original order.
reference_solution: sed -n '/[0-9]/p' input.txt
execution:
  stdin: ''
  fixtures:
  - path: input.txt
    content: |
      1
      SHELLGEI
      file2
      333
      ONLINE
      JUDGE
  exit_code: ignore
  stderr: merge
judge:
  type: text
  expected_output: |
    1
    file2
    333
