id: STANDARD-00000039
title_ja: '重複削除'
title_en: 'Remove duplicates'
statement_ja: |
  入力の文字列から重複している文字だけを削除してください。
statement_en: |
  Delete only duplicate characters from the input string.
input: |
  aabcccddeefggggg
expected_output: |
  bf
answer: cat input.txt | sed 's/\([a-z]\)/\1\n/g' | uniq -u | tr -d '\n'
