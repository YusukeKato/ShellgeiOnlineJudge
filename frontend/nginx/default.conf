limit_req_zone $binary_remote_addr zone=api_per_client:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=shellgei_per_client:10m rate=5r/s;
# 1つのfrontend全体で、平均1件/秒までshell実行requestを受け付ける。
# burst=2により、通常の1requestと合わせて最大3requestを即時に受け付ける。
# backendの3つのsandbox実行枠を埋められる一方、継続的なcontainer生成は抑制する。
limit_req_zone $server_name zone=shellgei_global:1m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=api_connections_per_client:10m;

server {
    listen 80;
    server_name shellgei-online-judge.com localhost;

    # HTTP -> HTTPS リダイレクト
    # location / {
    #     return 301 https://$host$request_uri;
    # }
}

server {
    listen 443 ssl;
    server_name shellgei-online-judge.com localhost;

    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    keepalive_requests 100;

    # SSL証明書の設定
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout  10m;
    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    root /usr/share/nginx/html;
    index index.html;

    # Docker内部のDNSサーバーを指定
    resolver 127.0.0.11 valid=30s;

    limit_req_status 429;
    limit_conn_status 429;

    # フロントエンド (React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # shell実行APIには、通常APIより厳しい受付制御を適用する。
    location = /api/shellgei {
        limit_req zone=shellgei_per_client burst=5 nodelay;
        limit_req zone=shellgei_global burst=2 nodelay;
        limit_conn api_connections_per_client 5;

        proxy_pass http://backend:8000;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 外部入力のX-Forwarded-Forを引き継がず、直接接続元だけを渡す。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 問題一覧・問題取得など、その他のFastAPI endpoint。
    location /api {
        limit_req zone=api_per_client burst=40 nodelay;
        limit_conn api_connections_per_client 20;

        proxy_pass http://backend:8000;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
